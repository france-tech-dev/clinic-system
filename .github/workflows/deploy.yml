name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate database
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      HUSKY: "0"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Secret DATABASE_URL is not set (use the External Connection URL)"
            exit 1
          fi

      - name: Run migrations
        run: pnpm db:migrate

  deploy:
    name: Trigger Dokploy
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require Dokploy webhook
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "Secret DOKPLOY_DEPLOY_WEBHOOK is not set"
            exit 1
          fi

      - name: Call Dokploy deploy webhook
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --max-time 60 \
            "$DOKPLOY_DEPLOY_WEBHOOK"
          echo "Dokploy deploy triggered"
