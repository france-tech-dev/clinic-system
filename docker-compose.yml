# Infra local para desenvolvimento (app e worker correm no host via pnpm).
# Uso: docker compose up -d
# Redis: REDIS_URL=redis://127.0.0.1:6379

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
