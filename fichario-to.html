      function deleteEvaluation(id) {
        var record = null;
        for (var i = 0; i < state.evaluations.length; i++)
          if (state.evaluations[i].id === id) record = state.evaluations[i];
        state.evaluations = state.evaluations.filter(function (e) {
          return e.id !== id;
        });
        persist("to_evaluations", state.evaluations);
        showUndoToast("Avaliação removida", "evaluation", record);
      }
      function deleteSession(id) {
        var record = null;
        for (var i = 0; i < state.sessionNotes.length; i++)
          if (state.sessionNotes[i].id === id) record = state.sessionNotes[i];
        state.sessionNotes = state.sessionNotes.filter(function (s) {
          return s.id !== id;
        });
        persist("to_session_notes", state.sessionNotes);
        showUndoToast("Evolução removida", "session", record);
      }
      function deleteStudy(id) {
        var record = null;
        for (var i = 0; i < state.studyCards.length; i++)
          if (state.studyCards[i].id === id) record = state.studyCards[i];
        state.studyCards = state.studyCards.filter(function (c) {
          return c.id !== id;
        });
        persist("to_study", state.studyCards);
        showUndoToast("Nota removida", "study", record);
      }
      function restoreStudy() {
        var missing = DEFAULT_STUDY.filter(function (d) {
          return !state.studyCards.some(function (c) {
            return c.id === d.id;
          });
        });
        if (missing.length === 0) {
          showToast("Todos os resumos padrão já estão na sua área de estudo");
          return;
        }
        state.studyCards = state.studyCards.concat(missing);
        persist("to_study", state.studyCards);
        showToast(missing.length + " resumo(s) padrão restaurado(s)");
      }

      /* --------------------------------- render --------------------------------- */

      function mainContentHtml() {
        if (state.mode === "terapeuta") {
          if (state.tab === "painel") return painelTabHtml();
          if (state.tab === "agenda") return agendaTabHtml();
          if (state.tab === "biblioteca") return libraryTabHtml();
          if (state.tab === "pacientes")
            return state.selectedPatientId
              ? patientDetailHtml()
              : patientsListHtml();
          if (state.tab === "estudo") return studyTabHtml();
          return "";
        }
        return state.patientModeSelected
          ? patientModeViewHtml()
          : patientModePickerHtml();
      }

      function renderModal() {
        var root = document.getElementById("modal-root");
        if (!state.modal) {
          root.innerHTML = "";
          return;
        }
        var m = state.modal;
        var html = "";
        if (m.type === "exercise-form")
          html = exerciseFormModalHtml(m.payload.initial);
        else if (m.type === "exercise-detail") {
          var ex = null;
          for (var i = 0; i < state.exercises.length; i++)
            if (state.exercises[i].id === m.payload.id) ex = state.exercises[i];
          html = ex ? exerciseDetailModalHtml(ex) : "";
        } else if (m.type === "patient-form") html = patientFormModalHtml();
        else if (m.type === "assign-picker") html = assignPickerModalHtml();
        else if (m.type === "evaluation-form")
          html = evaluationFormModalHtml(m.payload.initial);
        else if (m.type === "evaluation-detail")
          html = evaluationDetailModalHtml(m.payload.id);
        else if (m.type === "study-form")
          html = studyFormModalHtml(m.payload.initial);
        else if (m.type === "study-detail") {
          var st = null;
          for (var j = 0; j < state.studyCards.length; j++)
            if (state.studyCards[j].id === m.payload.id)
              st = state.studyCards[j];
          html = st ? studyDetailModalHtml(st) : "";
        } else if (m.type === "confirm")
          html = confirmModalHtml(m.payload.text);
        else if (m.type === "backup") html = backupModalHtml();
        else if (m.type === "session-form")
          html = sessionFormModalHtml(m.payload.initial, m.payload.prefillDate);
        else if (m.type === "session-detail") {
          var sn = null;
          for (var k = 0; k < state.sessionNotes.length; k++)
            if (state.sessionNotes[k].id === m.payload.id)
              sn = state.sessionNotes[k];
          html = sn ? sessionDetailModalHtml(sn) : "";
        } else if (m.type === "appointment-form")
          html = appointmentFormModalHtml(m.payload.initial);
        else if (m.type === "global-search") html = globalSearchModalHtml();
        root.innerHTML = html;
      }

      function render() {
        var appEl = document.getElementById("app");
        if (!state.loaded) {
          appEl.innerHTML =
            '<div class="empty-state">Carregando fichário…</div>';
          return;
        }
        appEl.innerHTML =
          headerHtml() +
          '<main class="main"><div class="container">' +
          mainContentHtml() +
          "</div></main>";
        renderModal();
      }

      function renderPreserveFocus() {
        var active = document.activeElement;
        var id = active && active.id;
        var selStart =
          active && typeof active.selectionStart === "number"
            ? active.selectionStart
            : null;
        var selEnd =
          active && typeof active.selectionEnd === "number"
            ? active.selectionEnd
            : null;
        render();
        if (id) {
          var el = document.getElementById(id);
          if (el) {
            el.focus();
            if (selStart !== null && el.setSelectionRange) {
              try {
                el.setSelectionRange(selStart, selEnd);
              } catch (e) {}
            }
          }
        }
      }

      function closeModal() {
        state.modal = null;
        render();
      }

      /* --------------------------------- events --------------------------------- */

      function handleClick(e) {
        if (
          e.target.classList &&
          e.target.classList.contains("modal-overlay")
        ) {
          closeModal();
          return;
        }
        var el = e.target.closest("[data-action]");
        if (!el) return;
        var action = el.dataset.action;
        var id = el.dataset.id;
        var value = el.dataset.value;
        var scope = el.dataset.scope;

        if (action === "pick-category") {
          var target = document.getElementById(el.dataset.target);
          if (target) target.value = value;
          var group = el.closest("[data-chip-group]");
          if (group) {
            group
              .querySelectorAll('[data-action="pick-category"]')
              .forEach(function (b) {
                b.classList.remove("chip-active");
                b.style.background = "transparent";
                b.style.color = "var(--muted)";
                var dot = b.querySelector(".chip-dot");
                if (dot) dot.style.background = b.dataset.color;
              });
          }
          el.style.background = el.dataset.color;
          el.style.color = "#fff";
          var dot2 = el.querySelector(".chip-dot");
          if (dot2) dot2.style.background = "#fff";
          return;
        }

        if (action === "pick-score") {
          var target2 = document.getElementById(el.dataset.target);
          if (target2) target2.value = value;
          var group2 = el.closest("[data-score-group]");
          if (group2)
            group2.querySelectorAll(".score-btn").forEach(function (b) {
              b.classList.remove("score-active");
            });
          el.classList.add("score-active");
          return;
        }

        if (action === "pick-status") {
          var target3 = document.getElementById(el.dataset.target);
          if (target3) target3.value = value;
          var group3 = el.closest("[data-status-group]");
          if (group3) {
            group3.querySelectorAll(".status-pill").forEach(function (b) {
              b.classList.remove("chip-active");
              b.style.background = "";
              b.style.color = "";
              b.style.borderColor = "";
            });
          }
          el.classList.add("chip-active");
          el.style.background = "var(--primary)";
          el.style.color = "#fff";
          el.style.borderColor = "var(--primary)";
          return;
        }

        if (action === "close-modal" || action === "confirm-no") {
          closeModal();
          return;
        }
        if (action === "print-page") {
          window.print();
          return;
        }
        if (action === "export-backup") {
          exportBackup();
          return;
        }
        if (action === "print-evaluation") {
          printEvaluationReport(id);
          return;
        }
        if (action === "print-anamnese") {
          printAnamneseReport();
          return;
        }
        if (action === "print-full-record") {
          printFullRecordReport();
          return;
        }

        switch (action) {
          case "set-mode":
            state.mode = value;
            state.patientModeSelected = null;
            break;
          case "set-tab":
            state.tab = value;
            break;
          case "open-backup":
            state.modal = { type: "backup", payload: {} };
            break;
          case "avaliacao-view":
            state.avaliacaoView = value;
            break;
          case "select-roteiro": {
            var r = roteiroById(value);
            state.avaliacaoView = "roteiro";
            state.roteiroId = value;
            state.roteiroSelectedTick = r.categories[0].tick;
            break;
          }
          case "roteiro-select-tick":
            state.roteiroSelectedTick = value;
            break;
          case "filter-category":
            if (scope === "library") state.filterCategory = value || null;
            else if (scope === "assign") state.assignCategory = value || null;
            else if (scope === "study")
              state.studyFilterCategory = value || null;
            break;
          case "filter-patient-status":
            state.patientStatusFilter = value || null;
            break;
          case "set-patient-status": {
            state.patients = state.patients.map(function (p) {
              return p.id === id ? Object.assign({}, p, { status: value }) : p;
            });
            persist("to_patients", state.patients);
            showToast("Status atualizado");
            break;
          }
          case "new-exercise":
            state.modal = { type: "exercise-form", payload: { initial: null } };
            break;
          case "open-exercise":
            state.modal = { type: "exercise-detail", payload: { id: id } };
            break;
          case "restore-exercises":
            restoreExercises();
            break;
          case "new-patient":
            state.modal = { type: "patient-form", payload: {} };
            break;
          case "select-patient":
            state.selectedPatientId = id;
            state.patientSubTab = "plano";
            state.avaliacaoView = "lista";
            break;
          case "dash-open-patient":
            state.tab = "pacientes";
            state.selectedPatientId = id;
            state.patientSubTab = value || "plano";
            state.avaliacaoView = "lista";
            break;
          case "back-patients":
            state.selectedPatientId = null;
            break;
          case "confirm-delete-patient": {
            var p = null;
            for (var i = 0; i < state.patients.length; i++)
              if (state.patients[i].id === id) p = state.patients[i];
            state.modal = {
              type: "confirm",
              payload: {
                text:
                  "Remover " +
                  (p ? p.name : "") +
                  " e todos os dados associados (plano e avaliações)?",
                onYes: function () {
                  deletePatient(id);
                },
              },
            };
            break;
          }
          case "patient-subtab":
            state.patientSubTab = value;
            break;
          case "open-assign-picker":
            state.assignSearch = "";
            state.assignCategory = null;
            state.modal = { type: "assign-picker", payload: {} };
            break;
          case "remove-assignment":
            state.plans = state.plans.filter(function (p) {
              return p.id !== id;
            });
            persist("to_plans", state.plans);
            break;
          case "new-evaluation":
            state.modal = {
              type: "evaluation-form",
              payload: { initial: null },
            };
            break;
          case "open-evaluation":
            state.modal = { type: "evaluation-detail", payload: { id: id } };
            break;
          case "new-session":
            state.modal = { type: "session-form", payload: { initial: null } };
            break;
          case "open-session":
            state.modal = { type: "session-detail", payload: { id: id } };
            break;
          case "edit-session": {
            var snE = null;
            for (var s1 = 0; s1 < state.sessionNotes.length; s1++)
              if (state.sessionNotes[s1].id === id)
                snE = state.sessionNotes[s1];
            state.modal = { type: "session-form", payload: { initial: snE } };
            break;
          }
          case "confirm-delete-session": {
            state.modal = {
              type: "confirm",
              payload: {
                text: "Excluir esta evolução de sessão? Essa ação não pode ser desfeita.",
                onYes: function () {
                  deleteSession(id);
                },
              },
            };
            break;
          }
          case "save-session": {
            var ok5 = saveSessionFromForm();
            if (!ok5) return;
            break;
          }
          case "save-anamnese":
            saveAnamnese();
            break;
          case "agenda-nav":
            if (!state.agendaSelectedDate)
              state.agendaSelectedDate = todayIso();
            if (value === "today") state.agendaSelectedDate = todayIso();
            else if (value === "prev")
              state.agendaSelectedDate = addDaysIso(
                state.agendaSelectedDate,
                -1,
              );
            else if (value === "next")
              state.agendaSelectedDate = addDaysIso(
                state.agendaSelectedDate,
                1,
              );
            break;
          case "new-appointment":
            state.modal = {
              type: "appointment-form",
              payload: { initial: null },
            };
            break;
          case "edit-appointment": {
            var apE = null;
            for (var a1 = 0; a1 < state.appointments.length; a1++)
              if (state.appointments[a1].id === id)
                apE = state.appointments[a1];
            state.modal = {
              type: "appointment-form",
              payload: { initial: apE },
            };
            break;
          }
          case "set-appointment-status": {
            var apS = null;
            for (var s2 = 0; s2 < state.appointments.length; s2++)
              if (state.appointments[s2].id === id)
                apS = state.appointments[s2];
            state.appointments = state.appointments.map(function (a) {
              return a.id === id ? Object.assign({}, a, { status: value }) : a;
            });
            persist("to_appointments", state.appointments);
            if (value === "realizado" && apS) {
              state.selectedPatientId = apS.patientId;
              state.modal = {
                type: "session-form",
                payload: { initial: null, prefillDate: apS.date },
              };
            }
            break;
          }
          case "confirm-delete-appointment":
            state.modal = {
              type: "confirm",
              payload: {
                text: "Excluir este agendamento?",
                onYes: function () {
                  deleteAppointment(id);
                },
              },
            };
            break;
          case "save-appointment": {
            var ok6 = saveAppointmentFromForm();
            if (!ok6) return;
            break;
          }
          case "goto-agenda":
            state.tab = "agenda";
            state.agendaSelectedDate = todayIso();
            break;
          case "save-professional":
            saveProfessionalFromForm();
            break;
          case "open-global-search":
            state.globalSearchQuery = "";
            state.modal = { type: "global-search", payload: {} };
            break;
          case "goto-evaluation": {
            var evG = null;
            for (var g1 = 0; g1 < state.evaluations.length; g1++)
              if (state.evaluations[g1].id === id) evG = state.evaluations[g1];
            if (evG) {
              state.tab = "pacientes";
              state.selectedPatientId = evG.patientId;
              state.patientSubTab = "avaliacoes";
              state.avaliacaoView = "lista";
              state.modal = { type: "evaluation-detail", payload: { id: id } };
            }
            break;
          }
          case "goto-session": {
            var snG = null;
            for (var g2 = 0; g2 < state.sessionNotes.length; g2++)
              if (state.sessionNotes[g2].id === id)
                snG = state.sessionNotes[g2];
            if (snG) {
              state.tab = "pacientes";
              state.selectedPatientId = snG.patientId;
              state.patientSubTab = "evolucao";
              state.modal = { type: "session-detail", payload: { id: id } };
            }
            break;
          }
          case "goto-exercise":
            state.tab = "biblioteca";
            state.modal = { type: "exercise-detail", payload: { id: id } };
            break;
          case "goto-study":
            state.tab = "estudo";
            state.modal = { type: "study-detail", payload: { id: id } };
            break;
          case "assign-exercise":
            assignExercise(state.selectedPatientId, id);
            break;
          case "new-study":
            state.modal = { type: "study-form", payload: { initial: null } };
            break;
          case "open-study":
            state.modal = { type: "study-detail", payload: { id: id } };
            break;
          case "restore-study":
            restoreStudy();
            break;
          case "select-patient-mode":
            state.patientModeSelected = id;
            break;
          case "back-patient-mode":
            state.patientModeSelected = null;
            break;
          case "toggle-completed":
            state.plans = state.plans.map(function (p) {
              return p.id === id
                ? Object.assign({}, p, { completed: !p.completed })
                : p;
            });
            persist("to_plans", state.plans);
            break;
          case "edit-exercise": {
            var exE = null;
            for (var a = 0; a < state.exercises.length; a++)
              if (state.exercises[a].id === id) exE = state.exercises[a];
            state.modal = { type: "exercise-form", payload: { initial: exE } };
            break;
          }
          case "confirm-delete-exercise": {
            var exD = null;
            for (var b = 0; b < state.exercises.length; b++)
              if (state.exercises[b].id === id) exD = state.exercises[b];
            state.modal = {
              type: "confirm",
              payload: {
                text:
                  'Excluir "' +
                  (exD ? exD.title : "") +
                  '" da biblioteca? Isso também removerá essa atividade dos planos de pacientes.',
                onYes: function () {
                  deleteExercise(id);
                },
              },
            };
            break;
          }
          case "save-exercise": {
            var ok1 = saveExerciseFromForm();
            if (!ok1) return;
            break;
          }
          case "save-patient": {
            var ok2 = savePatientFromForm();
            if (!ok2) return;
            break;
          }
          case "edit-evaluation": {
            var evE = null;
            for (var c = 0; c < state.evaluations.length; c++)
              if (state.evaluations[c].id === id) evE = state.evaluations[c];
            state.modal = {
              type: "evaluation-form",
              payload: { initial: evE },
            };
            break;
          }
          case "confirm-delete-evaluation":
            state.modal = {
              type: "confirm",
              payload: {
                text: "Excluir esta avaliação? Essa ação não pode ser desfeita.",
                onYes: function () {
                  deleteEvaluation(id);
                },
              },
            };
            break;
          case "assign-suggested": {
            var evId = state.modal.payload.id;
            var evS = null;
            for (var d = 0; d < state.evaluations.length; d++)
              if (state.evaluations[d].id === evId) evS = state.evaluations[d];
            if (evS) assignExercise(evS.patientId, id);
            break;
          }
          case "save-evaluation": {
            var ok3 = saveEvaluationFromForm();
            if (!ok3) return;
            break;
          }
          case "edit-study": {
            var stE = null;
            for (var f = 0; f < state.studyCards.length; f++)
              if (state.studyCards[f].id === id) stE = state.studyCards[f];
            state.modal = { type: "study-form", payload: { initial: stE } };
            break;
          }
          case "confirm-delete-study": {
            var stD = null;
            for (var g = 0; g < state.studyCards.length; g++)
              if (state.studyCards[g].id === id) stD = state.studyCards[g];
            state.modal = {
              type: "confirm",
              payload: {
                text: 'Excluir a nota "' + (stD ? stD.title : "") + '"?',
                onYes: function () {
                  deleteStudy(id);
                },
              },
            };
            break;
          }
          case "save-study": {
            var ok4 = saveStudyFromForm();
            if (!ok4) return;
            break;
          }
          case "confirm-yes": {
            var cb =
              state.modal && state.modal.payload && state.modal.payload.onYes;
            state.modal = null;
            if (cb) cb();
            break;
          }
          case "undo-delete":
            undoLastDelete();
            break;
          default:
            return;
        }
        render();
      }

      function handleInput(e) {
        var live = e.target.dataset && e.target.dataset.live;
        if (!live) return;
        state[live] = e.target.value;
        renderPreserveFocus();
      }

      function saveRoteiroNote(patientId, roteiroId, tick, notes) {
        var existing = null;
        for (var i = 0; i < state.roteiroNotes.length; i++)
          if (
            state.roteiroNotes[i].patientId === patientId &&
            state.roteiroNotes[i].roteiroId === roteiroId &&
            state.roteiroNotes[i].categoryTick === tick
          )
            existing = state.roteiroNotes[i];
        if (existing) {
          existing.notes = notes;
        } else {
          state.roteiroNotes.push({
            id: uid(),
            patientId: patientId,
            roteiroId: roteiroId,
            categoryTick: tick,
            notes: notes,
          });
        }
        persist("to_roteiro_notes", state.roteiroNotes);
      }
      function handleFocusOut(e) {
        var t = e.target;
        if (
          t &&
          t.tagName === "TEXTAREA" &&
          t.dataset &&
          t.dataset.roteiroNotes
        ) {
          saveRoteiroNote(
            t.dataset.patient,
            t.dataset.roteiro,
            t.dataset.tick,
            t.value,
          );
        }
      }

      function handleFileChange(e) {
        if (e.target && e.target.id === "import-backup-input") {
          var file = e.target.files && e.target.files[0];
          if (file) importBackupFile(file);
        }
      }

      document.addEventListener("click", handleClick);
      document.addEventListener("input", handleInput);
      document.addEventListener("focusout", handleFocusOut);
      document.addEventListener("change", handleFileChange);

      /* --------------------------------- init --------------------------------- */

      function init() {
        var ex = getData("to_exercises", null);
        if (!ex || !ex.length) {
          ex = DEFAULT_EXERCISES.slice();
          setData("to_exercises", ex);
        }
        state.exercises = ex;
        state.patients = getData("to_patients", []) || [];
        state.plans = getData("to_plans", []) || [];
        state.evaluations = getData("to_evaluations", []) || [];
        var st = getData("to_study", null);
        if (!st || !st.length) {
          st = DEFAULT_STUDY.slice();
          setData("to_study", st);
        }
        state.studyCards = st;
        var rn = getData("to_roteiro_notes", null);
        if (!rn) {
          rn = [];
          var legacySi = getData("to_si_notes", null);
          if (legacySi && legacySi.length) {
            legacySi.forEach(function (n) {
              rn.push({
                id: n.id,
                patientId: n.patientId,
                roteiroId: "si",
                categoryTick: n.categoryTick,
                notes: n.notes,
              });
            });
          }
          setData("to_roteiro_notes", rn);
        }
        state.roteiroNotes = rn;
        state.sessionNotes = getData("to_session_notes", []) || [];
        state.anamneses = getData("to_anamneses", []) || [];
        state.appointments = getData("to_appointments", []) || [];
        state.professional = getData("to_professional", {}) || {};
        state.loaded = true;
        render();
      }
      init();
    </script>
  </body>
</html>
