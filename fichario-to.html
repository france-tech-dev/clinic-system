<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fichário TO — Biblioteca de Atividades Terapêuticas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #edeae0;
        --surface: #faf8f2;
        --ink: #23281f;
        --muted: #726c5e;
        --line: #dad4c4;
        --primary: #285c52;
        --primary-soft: #dce6e2;
        --patient: #a65d53;
        --patient-soft: #f1deda;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Work Sans", "Segoe UI", system-ui, sans-serif;
      }
      .serif {
        font-family: "Fraunces", Georgia, serif;
      }
      .mono {
        font-family: "IBM Plex Mono", Consolas, monospace;
        color: var(--muted);
        letter-spacing: 0.03em;
      }
      .container {
        max-width: 72rem;
        margin: 0 auto;
        padding: 0 1rem;
      }
      @media (min-width: 640px) {
        .container {
          padding: 0 1.5rem;
        }
      }

      .header {
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: var(--paper);
        z-index: 30;
      }
      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
        padding: 1rem 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .brand-badge {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 2px;
        background: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .brand h1 {
        font-size: 1.375rem;
        margin: 0;
        line-height: 1;
        font-weight: 600;
      }
      .brand p {
        font-size: 0.6875rem;
        margin: 0.25rem 0 0;
      }

      .mode-toggle {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 0.375rem;
        overflow: hidden;
      }
      .mode-btn {
        padding: 0.5rem 0.875rem;
        font-size: 0.875rem;
        border: none;
        background: transparent;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        cursor: pointer;
        font-family: inherit;
      }
      .mode-btn.active-terapeuta {
        background: var(--primary);
        color: #fff;
      }
      .mode-btn.active-paciente {
        background: var(--patient);
        color: #fff;
      }

      .tabs-row {
        display: flex;
        gap: 1.25rem;
        overflow-x: auto;
        margin-top: -1px;
      }
      .tab-btn {
        padding-bottom: 0.625rem;
        font-size: 0.875rem;
        font-weight: 500;
        border: none;
        background: none;
        border-bottom: 2px solid transparent;
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
        font-family: inherit;
      }
      .tab-btn.active {
        border-color: var(--primary);
        color: var(--ink);
      }

      main.main {
        padding: 1.5rem 0;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.375rem;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        border: none;
        cursor: pointer;
        font-family: inherit;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-ghost {
        background: transparent;
        color: var(--muted);
      }
      .btn-danger-text {
        background: transparent;
        color: var(--patient);
      }
      .btn-sm {
        padding: 0.375rem 0.75rem;
        font-size: 0.8125rem;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        padding: 0.375rem 0.75rem;
        border-radius: 9999px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        font-size: 0.8125rem;
        cursor: pointer;
        font-family: inherit;
      }
      .chip-dot {
        width: 7px;
        height: 7px;
        border-radius: 9999px;
        flex-shrink: 0;
        display: inline-block;
      }
      .chips-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1.25rem;
      }

      .search-wrap {
        position: relative;
        flex: 1;
      }
      .search-wrap svg {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
      }
      .search-input {
        width: 100%;
        padding: 0.5rem 0.75rem 0.5rem 2.25rem;
        border-radius: 0.375rem;
        border: 1px solid var(--line);
        background: var(--surface);
        font-size: 0.875rem;
        font-family: inherit;
      }
      .toolbar {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      @media (min-width: 640px) {
        .toolbar {
          flex-direction: row;
          align-items: center;
        }
      }

      .card-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
        padding-top: 0.5rem;
      }
      @media (min-width: 640px) {
        .card-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (min-width: 1024px) {
        .card-grid {
          grid-template-columns: 1fr 1fr 1fr;
        }
      }

      .index-card {
        position: relative;
        background: var(--surface);
        border-radius: 2px 10px 10px 10px;
        box-shadow:
          2px 3px 0 rgba(35, 40, 31, 0.08),
          0 1px 3px rgba(35, 40, 31, 0.1);
        padding: 1.5rem 1rem 1rem;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        height: 100%;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
        border: none;
        text-align: left;
        width: 100%;
        font-family: inherit;
        color: inherit;
      }
      .index-card:hover {
        transform: translateY(-3px) rotate(-0.4deg);
        box-shadow:
          3px 7px 0 rgba(35, 40, 31, 0.1),
          0 6px 14px rgba(35, 40, 31, 0.14);
      }
      .card-tab {
        position: absolute;
        top: -0.75rem;
        left: 1rem;
        padding: 0.25rem 0.5rem;
        border-radius: 2px 4px 0 4px;
        font-size: 0.625rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #fff;
        font-family: "IBM Plex Mono", Consolas, monospace;
      }
      .card-title {
        font-size: 1rem;
        font-weight: 600;
        margin: 0.25rem 0 0;
        line-height: 1.3;
      }
      .card-desc {
        font-size: 0.875rem;
        color: var(--muted);
        margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card-footer {
        margin-top: auto;
        padding-top: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .level-dots {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
      }
      .level-dot {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: var(--line);
        display: inline-block;
      }
      .level-dot.filled {
        background: var(--ink);
      }

      .empty-state {
        text-align: center;
        padding: 4rem 0;
        color: var(--muted);
        font-size: 0.875rem;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 50;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      @media (min-width: 640px) {
        .modal-overlay {
          align-items: center;
          padding: 1rem;
        }
      }
      .modal {
        background: var(--surface);
        width: 100%;
        max-width: 32rem;
        max-height: 90vh;
        overflow-y: auto;
        padding: 1.25rem;
        border-radius: 0.75rem 0.75rem 0 0;
      }
      @media (min-width: 640px) {
        .modal {
          border-radius: 0.5rem;
          padding: 1.5rem;
        }
      }
      .modal.modal-wide {
        max-width: 40rem;
      }
      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
        gap: 0.5rem;
      }
      .modal-title {
        font-size: 1.125rem;
        font-weight: 600;
        margin: 0;
      }
      .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 0.25rem;
        border-radius: 0.25rem;
        display: inline-flex;
      }
      .icon-btn:hover {
        background: rgba(0, 0, 0, 0.05);
      }

      .field {
        display: block;
        margin-bottom: 0.75rem;
      }
      .field-label {
        display: block;
        font-size: 0.6875rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--muted);
        font-family: "IBM Plex Mono", Consolas, monospace;
        margin-bottom: 0.25rem;
        text-transform: uppercase;
      }
      .input,
      .textarea,
      .select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 0.375rem;
        padding: 0.5rem 0.75rem;
        font-size: 0.875rem;
        font-family: inherit;
        background: #fff;
      }
      .textarea {
        resize: vertical;
      }
      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        padding-top: 0.5rem;
        flex-wrap: wrap;
      }
      .form-error {
        color: var(--patient);
        font-size: 0.875rem;
        margin: 0 0 0.5rem;
      }

      .score-row {
        display: flex;
        gap: 0.25rem;
      }
      .score-btn {
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 500;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: inherit;
      }
      .score-btn.score-active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }
      .domain-row {
        padding: 0.625rem 0;
        border-bottom: 1px solid var(--line);
      }
      .domain-row-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 0.375rem;
      }
      .domain-note {
        width: 100%;
        font-size: 0.75rem;
        padding: 0.375rem 0.625rem;
        border-radius: 0.375rem;
        border: 1px solid var(--line);
        font-family: inherit;
      }

      .list-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem;
        border-radius: 0.375rem;
        border: 1px solid var(--line);
        background: var(--surface);
        margin-bottom: 0.5rem;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        flex-shrink: 0;
        display: inline-block;
      }

      .patient-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 1rem;
        border-radius: 0.5rem;
        border: 1px solid var(--line);
        background: var(--surface);
        text-align: left;
        width: 100%;
        cursor: pointer;
        font-family: inherit;
        color: inherit;
      }
      .patients-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      @media (min-width: 640px) {
        .patients-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (min-width: 1024px) {
        .patients-grid {
          grid-template-columns: 1fr 1fr 1fr;
        }
      }

      .subtabs {
        display: flex;
        gap: 1.25rem;
        margin-bottom: 1.25rem;
        border-bottom: 1px solid var(--line);
      }

      .progress-track {
        width: 100%;
        height: 0.5rem;
        border-radius: 9999px;
        background: var(--patient-soft);
      }
      .progress-fill {
        height: 0.5rem;
        border-radius: 9999px;
        background: var(--patient);
        transition: width 0.2s;
      }

      .plan-item-patient {
        padding: 1rem;
        border-radius: 0.5rem;
        border: 1px solid var(--line);
        background: var(--surface);
        display: flex;
        align-items: flex-start;
        gap: 1rem;
        margin-bottom: 0.75rem;
      }

      .toast {
        position: fixed;
        bottom: 1.25rem;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--surface);
        padding: 0.625rem 1rem;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        z-index: 60;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
      }

      .eval-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        padding: 0.25rem 0.625rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        color: #fff;
      }
      .eval-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem;
        border-radius: 0.375rem;
        border: 1px solid var(--line);
        background: var(--surface);
        margin-bottom: 0.5rem;
        cursor: pointer;
        width: 100%;
        text-align: left;
        font-family: inherit;
        color: inherit;
      }
      .eval-avg {
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 600;
        flex-shrink: 0;
      }

      .comparison-box {
        margin-bottom: 1.25rem;
        padding: 0.75rem;
        border-radius: 0.375rem;
        background: var(--primary-soft);
      }
      .suggestion-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.625rem;
        border-radius: 0.375rem;
        border: 1px solid var(--line);
        margin-bottom: 0.5rem;
      }

      .si-ruler {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 8px;
        margin-bottom: 1.25rem;
      }
      .si-tick {
        flex: 0 0 auto;
        min-width: 104px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        cursor: pointer;
        text-align: left;
        font-family: inherit;
      }
      .si-tick .si-n {
        font-family: "IBM Plex Mono", Consolas, monospace;
        font-size: 9.5px;
        letter-spacing: 0.06em;
        color: var(--muted);
        display: block;
      }
      .si-tick .si-lbl {
        font-weight: 600;
        font-size: 11px;
        color: var(--ink);
        display: block;
        margin-top: 3px;
      }
      .si-tick.active {
        background: var(--primary);
        border-color: var(--primary);
      }
      .si-tick.active .si-n {
        color: var(--primary-soft);
      }
      .si-tick.active .si-lbl {
        color: #fff;
      }

      .si-table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .si-table th {
        text-align: left;
        font-family: "IBM Plex Mono", Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 2px solid var(--ink);
        padding: 8px 12px;
        background: var(--paper);
      }
      .si-table td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 12.8px;
        vertical-align: top;
      }
      .si-table tr:last-child td {
        border-bottom: none;
      }
      .si-table td.item {
        font-weight: 600;
        width: 20%;
      }
      .si-table td.read::before {
        content: "→ ";
        color: var(--primary);
        font-weight: 600;
      }
      @media (max-width: 700px) {
        .si-table thead {
          display: none;
        }
        .si-table tr {
          display: block;
          border-bottom: 2px solid var(--line);
          padding: 8px 0;
        }
        .si-table td {
          display: block;
          border: none;
          padding: 4px 12px;
        }
        .si-table td::before {
          content: attr(data-label);
          display: block;
          font-family: "IBM Plex Mono", Consolas, monospace;
          font-size: 9px;
          text-transform: uppercase;
          color: var(--muted);
          margin-bottom: 2px;
        }
        .si-table td.read::before {
          content: attr(data-label) " →";
          display: block;
        }
      }
      @media print {
        .no-print {
          display: none !important;
        }
        body {
          background: #fff;
        }
        .modal-overlay {
          display: none !important;
        }
      }

      .print-report {
        display: none;
      }
      @media print {
        body.printing-full-report #app,
        body.printing-full-report #modal-root,
        body.printing-full-report #toast-root {
          display: none !important;
        }
        body.printing-full-report .print-report {
          display: block !important;
        }
        .print-report {
          color: #000;
          font-family: "Work Sans", "Segoe UI", sans-serif;
          max-width: 800px;
          margin: 0 auto;
        }
        .print-report h1 {
          font-family: "Fraunces", Georgia, serif;
          font-size: 20px;
          margin: 0 0 2px;
        }
        .print-report h2 {
          font-family: "Fraunces", Georgia, serif;
          font-size: 15px;
          margin: 0 0 12px;
          color: #333;
        }
        .print-report table {
          width: 100%;
          border-collapse: collapse;
          margin: 6px 0 14px;
        }
        .print-report th,
        .print-report td {
          border: 1px solid #999;
          padding: 6px 8px;
          font-size: 12px;
          text-align: left;
          vertical-align: top;
        }
        .print-report th {
          background: #eee;
        }
        .print-report .rep-top {
          border-bottom: 2px solid #000;
          padding-bottom: 10px;
          margin-bottom: 14px;
          display: flex;
          justify-content: space-between;
          align-items: flex-end;
          gap: 12px;
        }
        .print-report .rep-meta {
          font-size: 11px;
          color: #555;
          text-align: right;
        }
        .print-report .rep-section-title {
          font-family: "IBM Plex Mono", Consolas, monospace;
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          color: #555;
          margin: 14px 0 4px;
          border-bottom: 1px solid #999;
          padding-bottom: 2px;
        }
        .print-report p {
          font-size: 12.5px;
          margin: 0 0 6px;
          line-height: 1.45;
        }
        .print-report ul {
          margin: 4px 0;
          padding-left: 18px;
          font-size: 12.5px;
        }
        .print-report .rep-signature {
          margin-top: 56px;
          border-top: 1px solid #000;
          width: 280px;
          padding-top: 4px;
          font-size: 11.5px;
          color: #333;
        }
        @page {
          margin: 1.5cm;
        }
      }

      .anam-section {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 1rem 1.25rem 1.25rem;
        margin-bottom: 1rem;
      }
      .anam-section-head {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        border-bottom: 2px solid var(--ink);
        padding-bottom: 0.5rem;
        margin-bottom: 0.75rem;
        flex-wrap: wrap;
      }
      .anam-num {
        font-family: "IBM Plex Mono", Consolas, monospace;
        font-size: 11px;
        color: var(--primary);
        background: var(--primary-soft);
        padding: 2px 8px;
        border-radius: 20px;
      }
      .anam-field-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1rem;
      }
      .anam-field {
        flex: 1 1 190px;
        margin-bottom: 0.5rem;
      }
      .anam-field .field-label {
        margin-bottom: 0.2rem;
      }
      .anam-field.anam-w-sm {
        flex: 1 1 110px;
      }
      .anam-field.anam-w-lg {
        flex: 2 1 260px;
      }
      .anam-field.anam-w-full {
        flex: 1 1 100%;
      }
      .anam-status-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--line);
      }
      .anam-status-label {
        flex: 1 1 190px;
        font-size: 0.8125rem;
        font-weight: 500;
      }
      .anam-status-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 0.375rem;
      }
      .status-pill {
        font-size: 0.75rem;
        padding: 0.3rem 0.625rem;
      }
      .anam-rating-grid {
        display: grid;

        {

          title:
            "Nomenclatura da Integração Sensorial de Ayres: conceitos, observação e atividades",
          categoryId: "pediatria",
          isCustom: false,
          content:
            'O QUE É\nA Integração Sensorial de Ayres (ASI) é o referencial teórico e prático desenvolvido por A. Jean Ayres que explica como o sistema nervoso central recebe, organiza e interpreta as informações sensoriais do corpo e do ambiente para gerar respostas adaptativas. A nomenclatura da área descreve tanto os sistemas sensoriais trabalhados quanto os processos neurológicos e os padrões observados na prática clínica.\n\nSISTEMAS SENSORIAIS DE BASE\n\nTátil — processamento do toque, pressão, textura e dor pela pele.\nComo observar: reação exagerada ou ausente a texturas, roupas e toque de outras pessoas; seletividade alimentar por textura; dificuldade em reconhecer objetos só pelo tato (estereognosia).\nAtividades: caixa sensorial tátil com texturas variadas; pintura com as mãos; jogo de identificar objetos escondidos só pelo tato; pressão profunda com bolinhas ou rolos texturizados.\n\nVestibular — processamento do movimento, da gravidade e da posição da cabeça, captado pelo ouvido interno.\nComo observar: medo de altura ou de balançar (insegurança gravitacional) ou, no extremo oposto, busca constante por girar, balançar e correr sem se cansar; quedas frequentes; dificuldade de manter o equilíbrio.\nAtividades: balanço terapêutico, rede, prancha de equilíbrio, cama elástica, gangorra, andar sobre linha reta ou trave baixa.\n\nProprioceptivo — processamento da posição e da força muscular e articular, dando noção do próprio corpo no espaço.\nComo observar: força mal graduada (aperta demais ou de menos), tropeços frequentes, busca por empurrar, puxar, colidir ou se jogar em almofadas.\nAtividades: empurrar ou puxar objetos pesados, carregar mochila com peso adequado, pular em colchão, atividades de "trabalho pesado" como amassar massinha, subir em cordas, engatinhar em túnel.\n\nMODULAÇÃO SENSORIAL\n\nHiper-responsividade — reação exagerada, de defesa ou desconforto diante de estímulos comuns.\nComo observar: tampa os ouvidos com sons do dia a dia, evita certas texturas de roupa ou comida, se incomoda com toque leve inesperado.\nAtividades: dessensibilização gradual com estímulos previsíveis e controlados pela própria criança, pressão profunda antes de estímulos leves, rotina de preparo sensorial antes de tarefas desafiadoras.\n\nHipo-responsividade — resposta diminuída ou ausente ao estímulo; a criança "não registra" a informação.\nComo observar: não percebe quando se machuca, não reage ao nome chamado, parece dispersa ou "no seu próprio mundo", precisa de estímulo intenso para se engajar.\nAtividades: estímulos de maior intensidade e curta duração, atividades de alerta rápido (pular, girar, sons e luzes diferentes), aumentar o contraste sensorial das tarefas.\n\nBusca sensorial — procura ativa e frequente por estímulos intensos.\nComo observar: bate, colide, morde objetos, gira sem apresentar tontura aparente, mexe constantemente em tudo que vê.\nAtividades: circuito motor com estações de impacto controlado, balanço vigoroso supervisionado, atividades estruturadas de input proprioceptivo e vestibular intenso.\n\nDISCRIMINAÇÃO SENSORIAL\nCapacidade de diferenciar qualidades e localizar com precisão um estímulo — de onde veio, o que é, o quanto.\nComo observar: erra a localização de um toque; dificuldade em reconhecer objetos pelo tato sem olhar; erro de posição do próprio braço ou perna com os olhos fechados (cinestesia); dificuldade em graduar força.\nAtividades: jogo de adivinhar objetos na caixa tátil, imitar posturas com os olhos fechados, tarefas de encaixe e classificação por tato.\n\nPRÁXIS (IDEAÇÃO, PLANEJAMENTO MOTOR E EXECUÇÃO)\nCapacidade de conceber, organizar e executar uma ação motora nova e não habitual — quando comprometida, é chamada de dispraxia.\nComo observar: dificuldade em iniciar uma brincadeira nova; desorganização ao copiar um movimento; brincar pobre, repetitivo, pouco criativo; muitas tentativas e erros para aprender uma sequência simples.\nAtividades: circuitos motores com obstáculos variados e trocados com frequência, imitação de posturas e sequências de movimento, faz de conta que exige planejar etapas, montar percursos com o próprio corpo.\n\nINTEGRAÇÃO BILATERAL E SEQUENCIAMENTO (BIS)\nCapacidade de coordenar os dois lados do corpo trabalhando juntos, incluindo o cruzamento da linha média.\nComo observar: troca de mão ou gira o corpo para evitar cruzar a linha média; dificuldade em atividades simétricas como polichinelo; desorganização ao usar as duas mãos em tarefas diferentes ao mesmo tempo.\nAtividades: bater palmas cruzando o corpo, jogos de bola que exigem pegar de um lado e lançar do outro, desenhar em oito (símbolo do infinito), rasgar papel com as duas mãos em direções opostas.\n\nCONTROLE POSTURAL-OCULAR\nBase de sustentação postural e de movimento coordenado dos olhos, essencial para tarefas de mesa e esportes.\nComo observar: dificuldade em seguir um alvo em movimento sem mover a cabeça; perde a linha ao copiar do quadro; cansaço postural rápido ao sentar.\nAtividades: seguir bolinha ou lanterna com os olhos, equilíbrio em prono sobre bola suíça, jogos de rebater ou pegar objetos em movimento.\n\nINSEGURANÇA GRAVITACIONAL E DEFENSIVIDADE TÁTIL\nDois padrões específicos e frequentes de hiper-responsividade: medo intenso e desproporcional de ter os pés fora do chão ou mudar de posição no espaço (insegurança gravitacional), e desconforto ou reação de alarme frente ao toque, sobretudo leve e inesperado (defensividade tátil).\nComo observar: recusa em subir em brinquedos de playground, ansiedade visível em atividades de balanço; evita fila, aglomeração, corte de cabelo, escovação dos dentes.\nAtividades: progressão gradual de desafios de equilíbrio com apoio de segurança e escolha da criança sobre o ritmo; introdução de toque sempre de forma previsível e com pressão firme, já que o toque leve costuma incomodar mais.',
        },

          el.innerHTML = "";

        }, 6000);

      function undoLastDelete() {

        undoBuffer = null;
        document.getElementById("toast-root").innerHTML = "";
        if (b.type === "exercise") {
          state.exercises = state.exercises.concat([b.record]);
          persist("to_exercises", state.exercises);
        } else if (b.type === "evaluation") {

          persist("to_evaluations", state.evaluations);
        } else if (b.type === "study") {

        if (iso === t) return "Hoje";
        if (iso === addDaysIso(t, 1)) return "Amanhã";
        if (iso === addDaysIso(t, -1)) return "Ontem";
        return weekdayOf(iso) + ", " + formatDateBR(iso);

      function saveAppointmentFromForm() {
        var patientId = document.getElementById("field-appt-patient").value;
        var date = document.getElementById("field-appt-date").value;
        var time = document.getElementById("field-appt-time").value;
        var duration =
          parseInt(document.getElementById("field-appt-duration").value, 10) ||
          0;
        var notes = document.getElementById("field-appt-notes").value.trim();
        if (!patientId) {
          document.getElementById("form-error-slot").innerHTML =
            '<p class="form-error">Selecione um paciente.</p>';
          return false;
        }
        if (!date) {
          document.getElementById("form-error-slot").innerHTML =
            '<p class="form-error">Informe a data.</p>';
          return false;
        }

        var initial = state.modal.payload.initial;
        if (initial) {
          var status = document.getElementById("field-appt-status").value;
          state.appointments = state.appointments.map(function (a) {
            return a.id === initial.id
              ? Object.assign({}, a, {
                  patientId: patientId,
                  date: date,
                  time: time,
                  duration: duration,
                  notes: notes,
                  status: status,
                })
              : a;
          });
          showToast("Agendamento atualizado");
        } else {
          var repeatEl = document.getElementById("field-appt-repeat");
          var repeatWeeks = repeatEl ? parseInt(repeatEl.value, 10) || 1 : 1;
          if (repeatWeeks < 1) repeatWeeks = 1;
          var created = [];
          for (var i = 0; i < repeatWeeks; i++) {
            created.push({
              id: uid(),
              patientId: patientId,
              date: addDaysIso(date, i * 7),
              time: time,
              duration: duration,
              notes: notes,
              status: "agendado",
            });
          }
          state.appointments = state.appointments.concat(created);
          showToast(
            repeatWeeks > 1
              ? repeatWeeks + " agendamentos criados"
              : "Agendamento criado",
          );
        }
        persist("to_appointments", state.appointments);
        state.modal = null;
        return true;
      }

      function deleteAppointment(id) {
        var record = null;
        for (var i = 0; i < state.appointments.length; i++)
          if (state.appointments[i].id === id) record = state.appointments[i];
        state.appointments = state.appointments.filter(function (a) {
          return a.id !== id;
        });
        persist("to_appointments", state.appointments);
        showUndoToast("Agendamento removido", "appointment", record);
      }

      function anamRenderField(field, data) {
        var val = data[field.id];
        if (field.type === "subhead") {
          return '<div class="subhead">' + esc(field.label) + "</div>";
        }
        if (field.type === "text") {
          var wClass =
            field.w === "sm"
              ? " anam-w-sm"
              : field.w === "lg"
                ? " anam-w-lg"
                : "";
          return (
            '<div class="anam-field' +
            wClass +
            '"><span class="field-label">' +
            esc(field.label) +
            '</span><input id="anam-' +
            field.id +
            '" class="input" placeholder="' +
            esc(field.placeholder || "") +
            '" value="' +
            esc(val || "") +
            '"/></div>'
          );
        }
        if (field.type === "textarea") {
          return (
            '<div class="anam-field anam-w-full"><span class="field-label">' +
            esc(field.label) +
            '</span><textarea id="anam-' +
            field.id +
            '" class="textarea" rows="' +
            (field.rows || 4) +
            '" placeholder="' +
            esc(field.placeholder || "") +
            '">' +
            esc(val || "") +
            "</textarea></div>"
          );
        }
        if (field.type === "checkbox") {
          return (
            '<label style="display:flex;align-items:flex-start;gap:.5rem;font-size:.8125rem;margin-bottom:.5rem;cursor:pointer"><input type="checkbox" id="anam-' +
            field.id +
            '"' +
            (val ? " checked" : "") +
            ' style="margin-top:3px;flex-shrink:0"/> ' +
            esc(field.label) +
            "</label>"
          );
        }
        if (field.type === "status-table") {
          var rowsHtml = field.rows
            .map(function (rowLabel, idx) {
              var rowVal = (val && val[idx]) || "";
              var hid = "anam-" + field.id + "__" + idx;
              var pills = field.options
                .map(function (opt) {
                  var active = rowVal === opt;
                  return (
                    '<button type="button" class="chip status-pill' +
                    (active ? " chip-active" : "") +
                    '" data-action="pick-status" data-target="' +
                    hid +
                    '" data-value="' +
                    esc(opt) +
                    '"' +
                    (active
                      ? ' style="background:var(--primary);color:#fff;border-color:var(--primary)"'
                      : "") +
                    ">" +
                    esc(opt) +
                    "</button>"
                  );
                })
                .join("");
              return (
                '<div class="anam-status-row"><span class="anam-status-label">' +
                esc(rowLabel) +
                "</span>" +
                '<input type="hidden" id="' +
                hid +
                '" value="' +
                esc(rowVal) +
                '"/>' +
                '<div class="anam-status-pills" data-status-group="1">' +
                pills +
                "</div></div>"
              );
            })
            .join("");
          return (
            '<div class="anam-field anam-w-full"><span class="field-label">' +
            esc(field.label) +
            "</span>" +
            rowsHtml +
            "</div>"
          );
        }
        if (field.type === "rating-grid") {
          var items = field.items
            .map(function (label, idx) {
              var v = (val && val[idx]) || "";
              return (
                '<div class="anam-rating-item"><span>' +
                esc(label) +
                '</span><input type="number" min="1" max="10" id="anam-' +
                field.id +
                "__" +
                idx +
                '" value="' +
                esc(v) +
                '" class="anam-rating-input"/></div>'
              );
            })
            .join("");
          return (
            '<div class="anam-field anam-w-full"><span class="field-label">' +
            esc(field.label) +
            '</span><div class="anam-rating-grid">' +
            items +
            "</div></div>"
          );
        }
        return "";
      }

        for (var i = 0; i < state.anamneses.length; i++)
          if (state.anamneses[i].patientId === patientId)
            return state.anamneses[i].data;

      function anamReadField(field, out) {
        if (field.type === "text" || field.type === "textarea") {
          var el = document.getElementById("anam-" + field.id);
          out[field.id] = el ? el.value.trim() : "";
        } else if (field.type === "checkbox") {
          var cb = document.getElementById("anam-" + field.id);
          out[field.id] = cb ? cb.checked : false;
        } else if (field.type === "status-table") {
          var obj = {};
          field.rows.forEach(function (r, idx) {
            var hid = document.getElementById("anam-" + field.id + "__" + idx);
            obj[idx] = hid ? hid.value : "";
          });
          out[field.id] = obj;
        } else if (field.type === "rating-grid") {
          var robj = {};
          field.items.forEach(function (it, idx) {
            var inp = document.getElementById("anam-" + field.id + "__" + idx);
            robj[idx] = inp ? inp.value : "";
          });
          out[field.id] = robj;
        }
      }

      function saveAnamnese() {
        var out = {};
        ANAMNESE_SCHEMA.forEach(function (sec) {
          sec.fields.forEach(function (f) {
            if (f.type === "subhead") return;
            anamReadField(f, out);
          });
        });
        var existing = null;
        for (var i = 0; i < state.anamneses.length; i++)
          if (state.anamneses[i].patientId === state.selectedPatientId)
            existing = state.anamneses[i];
        if (existing) {
          existing.data = out;
        } else {
          state.anamneses.push({
            id: uid(),
            patientId: state.selectedPatientId,
            data: out,
          });
        }
        persist("to_anamneses", state.anamneses);
        showToast("Anamnese salva");
      }

      function patientModeViewHtml() {
        var p = null;
        for (var i = 0; i < state.patients.length; i++)
          if (state.patients[i].id === state.patientModeSelected)
            p = state.patients[i];
        if (!p) return "";
        var myPlans = state.plans.filter(function (pl) {
          return pl.patientId === p.id;
        });
        var done = myPlans.filter(function (pl) {
          return pl.completed;
        }).length;
        var pct = myPlans.length
          ? Math.round((done / myPlans.length) * 100)
          : 0;
        var progressHtml =
          myPlans.length > 0
            ? '<div style="margin-bottom:1.5rem">' +
              '<div class="mono" style="display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:.375rem"><span>' +
              done +
              " DE " +
              myPlans.length +
              " CONCLUÍDAS</span><span>" +
              pct +
              "%</span></div>" +
              '<div class="progress-track"><div class="progress-fill" style="width:' +
              pct +
              '%"></div></div></div>'
            : "";
        var itemsHtml;

      function evaluationDetailModalHtml(evalId) {
        var evaluation = null;
        for (var i = 0; i < state.evaluations.length; i++)
          if (state.evaluations[i].id === evalId)
            evaluation = state.evaluations[i];
        if (!evaluation) return "";
        var patientEvals = state.evaluations
          .filter(function (e) {
            return e.patientId === evaluation.patientId;
          })
          .sort(function (a, b) {
            return a.date.localeCompare(b.date);
          });
        var firstEval = patientEvals[0];
        var showComparison =
          patientEvals.length > 1 &&
          firstEval &&
          firstEval.id !== evaluation.id;
        var weakDomains = evaluation.domains
          .filter(function (d) {
            return d.score <= 2;
          })
          .map(function (d) {
            return d.categoryId;
          });
        var patientPlans = state.plans.filter(function (p) {
          return p.patientId === evaluation.patientId;
        });
        var suggestions = state.exercises
          .filter(function (e) {
            return weakDomains.indexOf(e.categoryId) > -1;
          })
          .slice(0, 5);

        var domainBars = evaluation.domains
          .map(function (d) {
            var cat = categoryOf(d.categoryId);
            return (
              '<div style="margin-bottom:.625rem">' +
              '<div style="display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:.25rem"><span style="display:inline-flex;align-items:center;gap:.25rem"><span class="chip-dot" style="background:' +
              cat.color +
              '"></span>' +
              esc(cat.label) +
              '</span><span style="color:var(--muted)">' +
              d.score +
              "/4</span></div>" +
              '<div style="width:100%;height:6px;border-radius:9999px;background:var(--line)"><div style="height:6px;border-radius:9999px;width:' +
              (d.score / 4) * 100 +
              "%;background:" +
              cat.color +
              '"></div></div>' +
              (d.note
                ? '<p style="font-size:.75rem;color:var(--muted);margin-top:.25rem">' +
                  esc(d.note) +
                  "</p>"
                : "") +
              "</div>"
            );
          })
          .join("");

        var comparisonHtml = "";
        if (showComparison) {
          var rows = evaluation.domains
            .map(function (d) {
              var cat = categoryOf(d.categoryId);
              var before = null;
              for (var i = 0; i < firstEval.domains.length; i++)
                if (firstEval.domains[i].categoryId === d.categoryId)
                  before = firstEval.domains[i];
              var delta = before ? d.score - before.score : 0;
              var iconName =
                delta > 0
                  ? "trending-up"
                  : delta < 0
                    ? "trending-down"
                    : "minus";
              var color =
                delta > 0
                  ? COLORS.primary
                  : delta < 0
                    ? COLORS.patient
                    : COLORS.muted;
              return (
                '<div style="display:flex;justify-content:space-between;font-size:.75rem"><span>' +
                esc(cat.label) +
                '</span><span style="display:inline-flex;align-items:center;gap:.25rem;color:' +
                color +
                '">' +
                (before ? before.score : "—") +
                " → " +
                d.score +
                " " +
                icon(iconName, 12, color) +
                "</span></div>"
              );
            })
            .join("");
          comparisonHtml =
            '<div class="comparison-box"><p class="field-label" style="color:var(--primary)">Evolução desde a avaliação inicial (' +
            formatDateBR(firstEval.date) +
            ')</p><div style="display:flex;flex-direction:column;gap:.375rem">' +
            rows +
            "</div></div>";
        }

        var goalsHtml = evaluation.objetivos
          ? '<p class="field-label" style="margin-top:.75rem">Objetivos terapêuticos</p><ul style="margin:.25rem 0 0;padding-left:1.1rem">' +
            evaluation.objetivos
              .split("\n")
              .filter(function (o) {
                return o;
              })
              .map(function (o) {
                return "<li>" + esc(o) + "</li>";
              })
              .join("") +
            "</ul>"
          : "";
        var condutasHtml = evaluation.condutas
          ? '<p class="field-label" style="margin-top:.75rem">Condutas / plano</p><p style="white-space:pre-line">' +
            esc(evaluation.condutas) +
            "</p>"
          : "";
        var freqAltaHtml =
          evaluation.frequencia || evaluation.criteriosAlta
            ? (evaluation.frequencia
                ? '<p class="field-label" style="margin-top:.75rem">Frequência proposta</p><p>' +
                  esc(evaluation.frequencia) +
                  "</p>"
                : "") +
              (evaluation.criteriosAlta
                ? '<p class="field-label" style="margin-top:.75rem">Critérios de alta</p><p>' +
                  esc(evaluation.criteriosAlta) +
                  "</p>"
                : "")
            : "";

        var idContextRows = [];
        if (evaluation.diagnostico)
          idContextRows.push(["Diagnóstico / CID", evaluation.diagnostico]);
        if (evaluation.encaminhadoPor)
          idContextRows.push(["Encaminhado por", evaluation.encaminhadoPor]);
        var idContextHtml = idContextRows.length
          ? '<div style="display:flex;flex-wrap:wrap;gap:1.5rem;font-size:.8125rem;margin-bottom:1rem">' +
            idContextRows
              .map(function (r) {
                return (
                  '<div><p class="field-label" style="margin-bottom:.125rem">' +
                  r[0] +
                  '</p><p style="margin:0">' +
                  esc(r[1]) +
                  "</p></div>"
                );
              })
              .join("") +
            "</div>"
          : "";

        var extraNotesRows = [];
        if (evaluation.contextoFamiliar)
          extraNotesRows.push([
            "Contexto familiar e social",
            evaluation.contextoFamiliar,
          ]);
        if (evaluation.nivelPrevio)
          extraNotesRows.push([
            "Nível de função prévio",
            evaluation.nivelPrevio,
          ]);
        if (evaluation.medicacoes)
          extraNotesRows.push(["Medicações em uso", evaluation.medicacoes]);
        if (evaluation.precaucoes)
          extraNotesRows.push([
            "Precauções / contraindicações",
            evaluation.precaucoes,
          ]);
        if (evaluation.equipamentos)
          extraNotesRows.push([
            "Uso de equipamentos / órteses",
            evaluation.equipamentos,
          ]);
        var extraNotesHtml = extraNotesRows.length
          ? '<div style="font-size:.875rem;margin-bottom:1.25rem">' +
            extraNotesRows
              .map(function (r) {
                return (
                  '<p class="field-label" style="margin-top:.75rem">' +
                  r[0] +
                  '</p><p style="white-space:pre-line;margin:0">' +
                  esc(r[1]) +
                  "</p>"
                );
              })
              .join("") +
            "</div>"
          : "";

        var suggestionsHtml = "";
        if (suggestions.length) {
          suggestionsHtml =
            '<div style="margin-top:1.25rem"><p class="field-label">Atividades sugeridas para os domínios mais baixos</p>' +
            suggestions
              .map(function (ex) {
                var cat = categoryOf(ex.categoryId);
                var already = patientPlans.some(function (p) {
                  return p.exerciseId === ex.id;
                });
                return (
                  '<div class="suggestion-row"><span class="dot" style="background:' +
                  cat.color +
                  '"></span><p style="flex:1;font-size:.875rem;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
                  esc(ex.title) +
                  "</p>" +
                  '<button class="btn btn-sm"' +
                  (already ? " disabled" : "") +
                  ' data-action="assign-suggested" data-id="' +
                  ex.id +
                  '" style="background:' +
                  (already ? "var(--line)" : "var(--primary)") +
                  ";color:" +
                  (already ? "var(--muted)" : "#fff") +
                  '">' +
                  (already ? "Atribuída" : "Atribuir") +
                  "</button></div>"
                );
              })
              .join("") +
            "</div>";
        }

        return modalWrapHtml(
          "" +
            '<div class="modal-header"><div class="eval-badge" style="background:' +
            (evaluation.tipo === "Inicial"
              ? "var(--primary)"
              : "var(--patient)") +
            '">' +
            icon("clipboard-check", 13, "#fff") +
            " " +
            (evaluation.tipo === "Inicial"
              ? "Avaliação inicial"
              : "Reavaliação") +
            '</div><button class="icon-btn" data-action="close-modal">' +
            icon("x", 18, COLORS.muted) +
            "</button></div>" +
            '<div style="display:flex;align-items:center;gap:.375rem;font-size:.75rem;color:var(--muted);margin-bottom:1rem">' +
            icon("calendar", 12) +
            " " +
            formatDateBR(evaluation.date) +
            "</div>" +
            idContextHtml +
            '<div style="font-size:.875rem;margin-bottom:1.25rem"><p class="field-label">Queixa principal</p><p>' +
            esc(evaluation.queixa) +
            "</p>" +
            (evaluation.historia
              ? '<p class="field-label" style="margin-top:.75rem">História</p><p style="white-space:pre-line">' +
                esc(evaluation.historia) +
                "</p>"
              : "") +
            "</div>" +
            extraNotesHtml +
            '<p class="field-label">Exame por domínio</p><div style="margin-bottom:1.25rem">' +
            domainBars +
            "</div>" +
            comparisonHtml +
            (goalsHtml || condutasHtml || freqAltaHtml
              ? '<div style="font-size:.875rem;margin-bottom:1.25rem">' +
                goalsHtml +
                condutasHtml +
                freqAltaHtml +
                "</div>"
              : "") +
            suggestionsHtml +
            '<div class="form-actions" style="border-top:1px solid var(--line);margin-top:1.25rem;padding-top:1rem">' +
            '<button class="btn btn-danger-text" data-action="confirm-delete-evaluation" data-id="' +
            evaluation.id +
            '">' +
            icon("trash", 14) +
            " Excluir</button>" +
            '<button class="btn" style="color:var(--ink)" data-action="print-evaluation" data-id="' +
            evaluation.id +
            '">' +
            icon("download", 14) +
            " Exportar PDF</button>" +
            '<button class="btn" style="color:var(--ink)" data-action="edit-evaluation" data-id="' +
            evaluation.id +
            '">' +
            icon("pencil", 14) +
            " Editar</button>" +
            "</div>",
          true,
        );
      }

      /* --------------------------------- modal: backup --------------------------------- */

      function globalSearchModalHtml() {
        var q = (state.globalSearchQuery || "").trim().toLowerCase();
        var resultsHtml = "";
        if (q.length < 2) {
          resultsHtml =
            '<p style="font-size:.8125rem;color:var(--muted)">Digite ao menos 2 letras para buscar em pacientes, avaliações, evoluções, biblioteca e notas de estudo.</p>';
        } else {
          var rows = [];

          state.patients.forEach(function (p) {
            if (p.name.toLowerCase().indexOf(q) > -1) {
              rows.push(
                searchRowHtml(
                  "Paciente",
                  p.name,
                  "",
                  "dash-open-patient",
                  p.id,
                  "plano",
                ),
              );
            }
          });

          state.evaluations.forEach(function (e) {
            var hay = (
              (e.queixa || "") +
              " " +
              (e.historia || "") +
              " " +
              (e.objetivos || "") +
              " " +
              (e.condutas || "")
            ).toLowerCase();
            if (hay.indexOf(q) > -1) {
              rows.push(
                searchRowHtml(
                  "Avaliação",
                  patientNameById(e.patientId) +
                    " — " +
                    (e.tipo === "Inicial" ? "Inicial" : "Reavaliação"),
                  formatDateBR(e.date),
                  "goto-evaluation",
                  e.id,
                  "",
                ),
              );
            }
          });

          state.sessionNotes.forEach(function (s) {
            var hay = (
              (s.atividades || "") +
              " " +
              (s.observacoes || "")
            ).toLowerCase();
            if (hay.indexOf(q) > -1) {
              rows.push(
                searchRowHtml(
                  "Evolução",
                  patientNameById(s.patientId),
                  formatDateBR(s.date),
                  "goto-session",
                  s.id,
                  "",
                ),
              );
            }
          });

          state.exercises.forEach(function (ex) {
            var hay = (
              (ex.title || "") +
              " " +
              (ex.objective || "")
            ).toLowerCase();
            if (hay.indexOf(q) > -1) {
              rows.push(
                searchRowHtml(
                  "Biblioteca",
                  ex.title,
                  categoryOf(ex.categoryId).label,
                  "goto-exercise",
                  ex.id,
                  "",
                ),
              );
            }
          });

          state.studyCards.forEach(function (c) {
            var hay = ((c.title || "") + " " + (c.content || "")).toLowerCase();
            if (hay.indexOf(q) > -1) {
              rows.push(
                searchRowHtml(
                  "Estudo",
                  c.title,
                  studyCategoryOf(c.categoryId).label,
                  "goto-study",
                  c.id,
                  "",
                ),
              );
            }
          });

          resultsHtml =
            rows.length === 0
              ? '<p style="font-size:.8125rem;color:var(--muted)">Nenhum resultado encontrado.</p>'
              : rows.join("");
        }

        return modalWrapHtml(
          "" +
            '<div class="modal-header"><h2 class="modal-title serif">Buscar</h2><button class="icon-btn" data-action="close-modal">' +
            icon("x", 18, COLORS.muted) +
            "</button></div>" +
            '<div class="search-wrap" style="margin-bottom:1rem">' +
            icon("search", 15) +
            '<input id="global-search-input" class="search-input" data-live="globalSearchQuery" placeholder="Nome do paciente, conteúdo de avaliação, atividade..." value="' +
            esc(state.globalSearchQuery || "") +
            '" autofocus/></div>' +
            "<div>" +
            resultsHtml +
            "</div>",
        );
      }

          "</p>" +
          (subtitle
            ? '<p style="font-size:.75rem;color:var(--muted);margin:0">' +
              esc(subtitle) +

      function exportBackup() {
        var data = {
          app: "Fichario TO",
          version: 1,
          exportedAt: new Date().toISOString(),
          exercises: state.exercises,
          patients: state.patients,
          plans: state.plans,
          evaluations: state.evaluations,
          studyCards: state.studyCards,
          siNotes: state.siNotes,
          sessionNotes: state.sessionNotes,
          anamneses: state.anamneses,
          roteiroNotes: state.roteiroNotes,
          appointments: state.appointments,
          professional: state.professional,
        };
        try {
          var blob = new Blob([JSON.stringify(data, null, 2)], {
            type: "application/json",
          });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download =
            "fichario-to-backup-" +
            new Date().toISOString().slice(0, 10) +
            ".json";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1000);
          showToast("Backup exportado");
        } catch (e) {
          showToast("Não foi possível exportar o backup.");
        }
      }

      function importBackupFile(file) {
        var reader = new FileReader();
        reader.onload = function (ev) {
          var data;
          try {
            data = JSON.parse(ev.target.result);
          } catch (err) {
            data = null;
          }
          var status = document.getElementById("backup-status");
          if (
            !data ||
            typeof data !== "object" ||
            (!Array.isArray(data.exercises) && !Array.isArray(data.patients))
          ) {
            if (status)
              status.innerHTML =
                '<p style="color:var(--patient)">Não foi possível ler o arquivo. Verifique se é um backup válido do Fichário TO.</p>';
            return;
          }
          state.modal = {
            type: "confirm",
            payload: {
              text: "Importar este backup vai substituir todos os dados atuais (biblioteca, pacientes, avaliações e notas) pelos dados do arquivo. Deseja continuar?",
              onYes: function () {
                applyBackup(data);
              },
            },
          };
          render();
        };
        reader.onerror = function () {
          showToast("Não foi possível ler o arquivo selecionado.");
        };
        reader.readAsText(file);
      }

      function applyBackup(data) {
        state.exercises = Array.isArray(data.exercises)
          ? data.exercises
          : DEFAULT_EXERCISES.slice();
        state.patients = Array.isArray(data.patients) ? data.patients : [];
        state.plans = Array.isArray(data.plans) ? data.plans : [];
        state.evaluations = Array.isArray(data.evaluations)
          ? data.evaluations
          : [];
        state.studyCards = Array.isArray(data.studyCards)
          ? data.studyCards
          : DEFAULT_STUDY.slice();
        state.siNotes = Array.isArray(data.siNotes) ? data.siNotes : [];
        if (Array.isArray(data.roteiroNotes)) {
          state.roteiroNotes = data.roteiroNotes;
        } else if (state.siNotes.length) {
          state.roteiroNotes = state.siNotes.map(function (n) {
            return {
              id: n.id,
              patientId: n.patientId,
              roteiroId: "si",
              categoryTick: n.categoryTick,
              notes: n.notes,
            };
          });
        } else {
          state.roteiroNotes = [];
        }
        state.sessionNotes = Array.isArray(data.sessionNotes)
          ? data.sessionNotes
          : [];
        state.anamneses = Array.isArray(data.anamneses) ? data.anamneses : [];
        state.appointments = Array.isArray(data.appointments)
          ? data.appointments
          : [];
        state.professional =
          data.professional && typeof data.professional === "object"
            ? data.professional
            : {};
        persist("to_exercises", state.exercises);
        persist("to_patients", state.patients);
        persist("to_plans", state.plans);
        persist("to_evaluations", state.evaluations);
        persist("to_study", state.studyCards);
        persist("to_si_notes", state.siNotes);
        persist("to_roteiro_notes", state.roteiroNotes);
        persist("to_session_notes", state.sessionNotes);
        persist("to_anamneses", state.anamneses);
        persist("to_appointments", state.appointments);
        persist("to_professional", state.professional);
        state.selectedPatientId = null;
        state.patientModeSelected = null;
        showToast("Backup importado com sucesso");
      }

      function anamFieldPrint(field, data) {
        if (field.type === "subhead")
          return (
            "<p style=\"font-family:'IBM Plex Mono',Consolas,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#555;margin:10px 0 4px;\">" +
            esc(field.label) +
            "</p>"
          );
        var val = data[field.id];
        if (field.type === "text") {
          if (!val) return "";
          return (
            "<p><strong>" + esc(field.label) + ":</strong> " + esc(val) + "</p>"
          );
        }
        if (field.type === "textarea") {
          if (!val) return "";
          return (
            "<p><strong>" +
            esc(field.label) +
            ":</strong> " +
            esc(val).replace(/\n/g, "<br/>") +
            "</p>"
          );
        }
        if (field.type === "checkbox") {
          return "<p>" + (val ? "☑" : "☐") + " " + esc(field.label) + "</p>";
        }
        if (field.type === "status-table") {
          var rows = field.rows
            .map(function (r, idx) {
              return (
                "<tr><td>" +
                esc(r) +
                "</td><td>" +
                esc((val && val[idx]) || "—") +
                "</td></tr>"
              );
            })
            .join("");
          return (
            "<p><strong>" +
            esc(field.label) +
            "</strong></p><table><tr><th>Item</th><th>Status</th></tr>" +
            rows +
            "</table>"
          );
        }
        if (field.type === "rating-grid") {
          var ritems = field.items
            .map(function (it, idx) {
              return (
                "<tr><td>" +
                esc(it) +
                "</td><td>" +
                esc((val && val[idx]) || "—") +
                "</td></tr>"
              );
            })
            .join("");
          return (
            "<p><strong>" +
            esc(field.label) +
            "</strong></p><table><tr><th>Área</th><th>Prioridade (1-10)</th></tr>" +
            ritems +
            "</table>"
          );
        }
        return "";
      }

      function printFullRecordReport() {
        var patient = null;
        for (var i = 0; i < state.patients.length; i++)
          if (state.patients[i].id === state.selectedPatientId)
            patient = state.patients[i];
        if (!patient) return;

        var hasAnam = state.anamneses.some(function (a) {
          return a.patientId === patient.id;
        });
        var pEvals = state.evaluations
          .filter(function (e) {
            return e.patientId === patient.id;
          })
          .sort(function (a, b) {
            return a.date.localeCompare(b.date);
          });
        var pSessions = state.sessionNotes
          .filter(function (s) {
            return s.patientId === patient.id;
          })
          .sort(function (a, b) {
            return a.date.localeCompare(b.date);
          });

        var html =
          '<div class="rep-top"><div><h1>Fichário TO</h1><h2>Prontuário Completo</h2></div>' +
          '<div class="rep-meta">Paciente: ' +
          esc(patient.name) +
          "<br/>Gerado em " +
          formatDateBR(new Date().toISOString().slice(0, 10)) +
          clinicLine() +
          "</div></div>";

        if (hasAnam) {
          html +=
            '<div class="rep-section-title" style="font-size:13px;background:#333;color:#fff;padding:5px 8px;margin-top:10px">ANAMNESE</div>' +
            buildAnamneseSectionHtml(patient);
        }
        if (pEvals.length) {
          html +=
            '<div class="rep-section-title" style="font-size:13px;background:#333;color:#fff;padding:5px 8px;margin-top:22px">AVALIAÇÕES (' +
            pEvals.length +
            ")</div>";
          pEvals.forEach(function (ev) {
            html += buildEvaluationSectionHtml(ev);
          });
        }
        if (pSessions.length) {
          html +=
            '<div class="rep-section-title" style="font-size:13px;background:#333;color:#fff;padding:5px 8px;margin-top:22px">EVOLUÇÕES DE SESSÃO (' +
            pSessions.length +
            ")</div>";
          pSessions.forEach(function (s) {
            html += buildSessionSectionHtml(s);
          });
        }
        if (!hasAnam && !pEvals.length && !pSessions.length) {
          html += "<p>Nenhum dado registrado para este paciente ainda.</p>";
        }
        html +=
          '<div class="rep-signature" style="margin-top:40px">' +
          signatureLine() +
          "</div>";

        document.getElementById("print-report").innerHTML = html;
        document.body.classList.add("printing-full-report");
        window.print();
      }

      function deleteExercise(id) {
        var record = null;
        for (var i = 0; i < state.exercises.length; i++)
          if (state.exercises[i].id === id) record = state.exercises[i];
        state.exercises = state.exercises.filter(function (e) {
          return e.id !== id;
        });
        state.plans = state.plans.filter(function (p) {
          return p.exerciseId !== id;
        });
        persist("to_exercises", state.exercises);
        persist("to_plans", state.plans);
        showUndoToast("Atividade removida", "exercise", record);
      }
      function restoreExercises() {
        var missing = DEFAULT_EXERCISES.filter(function (d) {
          return !state.exercises.some(function (e) {
            return e.id === d.id;
          });
        });
        if (missing.length === 0) {
          showToast("A biblioteca já contém todas as atividades padrão");
          return;
        }
        state.exercises = state.exercises.concat(missing);
        persist("to_exercises", state.exercises);
        showToast(missing.length + " atividade(s) padrão restaurada(s)");
      }
      function deletePatient(id) {
        state.patients = state.patients.filter(function (p) {
          return p.id !== id;
        });
        state.plans = state.plans.filter(function (p) {
          return p.patientId !== id;
        });
        state.evaluations = state.evaluations.filter(function (e) {
          return e.patientId !== id;
        });
        state.siNotes = state.siNotes.filter(function (n) {
          return n.patientId !== id;
        });
        state.roteiroNotes = state.roteiroNotes.filter(function (n) {
          return n.patientId !== id;
        });
        state.sessionNotes = state.sessionNotes.filter(function (s) {
          return s.patientId !== id;
        });
        state.anamneses = state.anamneses.filter(function (a) {
          return a.patientId !== id;
        });
        state.appointments = state.appointments.filter(function (a) {
          return a.patientId !== id;
        });
        persist("to_patients", state.patients);
        persist("to_plans", state.plans);
        persist("to_evaluations", state.evaluations);
        persist("to_si_notes", state.siNotes);
        persist("to_roteiro_notes", state.roteiroNotes);
        persist("to_session_notes", state.sessionNotes);
        persist("to_anamneses", state.anamneses);
        persist("to_appointments", state.appointments);
        state.selectedPatientId = null;
        if (state.patientModeSelected === id) state.patientModeSelected = null;
        showToast("Paciente removido");
